name: Prepare release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  draft:
    name: Create reviewable 1.0 release
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/release
          merge-multiple: true
      - name: Check required installable Android release
        run: test -f artifacts/release/FieldKit-1.0.0-Android.apk
      - name: Generate published checksums
        run: python3 scripts/checksums.py artifacts/release
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "FieldKit ${version}" --notes-file docs/RELEASE-NOTES-1.0.0.md
          fi
          gh release upload "$tag" artifacts/release/* --clobber
