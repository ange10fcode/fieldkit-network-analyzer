name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android and public-source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify public release source
        run: python3 scripts/verify_release.py
      - name: Run actual parser and loopback network checks
        run: python3 scripts/test_android.py
      - name: Install Android SDK components
        run: |
          sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          test -n "$sdk_manager"
          "$sdk_manager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build unsigned verification APK
        working-directory: android
        run: bash gradlew --no-daemon --console=plain :app:assembleRelease -PfieldkitUnsigned=true
      - name: Prepare signed or unsigned artifact
        env:
          FIELDKIT_KEYSTORE_B64: ${{ secrets.FIELDKIT_KEYSTORE_B64 }}
          FIELDKIT_KEYSTORE_PASSWORD: ${{ secrets.FIELDKIT_KEYSTORE_PASSWORD }}
          FIELDKIT_KEY_PASSWORD: ${{ secrets.FIELDKIT_KEY_PASSWORD }}
          FIELDKIT_KEY_ALIAS: ${{ secrets.FIELDKIT_KEY_ALIAS }}
          ALLOW_SIGNING: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          input=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [[ "$ALLOW_SIGNING" == "true" && -n "$FIELDKIT_KEYSTORE_B64" ]]; then
            python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"fieldkit-release.jks").write_bytes(base64.b64decode(os.environ["FIELDKIT_KEYSTORE_B64"],validate=True))'
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/fieldkit-release.jks" --ks-key-alias "$FIELDKIT_KEY_ALIAS" --ks-pass env:FIELDKIT_KEYSTORE_PASSWORD --key-pass env:FIELDKIT_KEY_PASSWORD --out artifacts/FieldKit-1.0.0-Android.apk "$input"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/FieldKit-1.0.0-Android.apk
            rm -f "$RUNNER_TEMP/fieldkit-release.jks"
          else
            cp "$input" artifacts/FieldKit-1.0.0-Android-UNSIGNED.apk
          fi
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 artifacts/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: artifacts/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.402'
      - name: Restore locked desktop dependencies
        run: dotnet restore desktop/FieldKit.Desktop/FieldKit.Desktop.csproj --locked-mode
      - name: Run real loopback and persistence tests
        run: dotnet run --project desktop/FieldKit.Core.Tests -c Release
      - name: Build desktop
        run: dotnet build desktop/FieldKit.Desktop/FieldKit.Desktop.csproj -c Release --no-restore
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1 libfreetype6 libxrender1 libxcb1 libxext6
      - name: Initialize every desktop screen on Windows
        if: runner.os == 'Windows'
        run: dotnet run --project desktop/FieldKit.Desktop -c Release --no-build -- --smoke-ui --data-dir work/desktop-smoke
      - name: Initialize every desktop screen on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet run --project desktop/FieldKit.Desktop -c Release --no-build -- --smoke-ui --data-dir work/desktop-smoke
      - name: Publish self-contained desktop
        run: dotnet publish desktop/FieldKit.Desktop/FieldKit.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/publish/${{ matrix.rid }}
      - name: Verify published Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./artifacts/publish/win-x64/FieldKit.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/publish/win-x64/FieldKit.exe --smoke-ui --data-dir work/published-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify published Linux executable
        if: runner.os == 'Linux'
        run: |
          ./artifacts/publish/linux-x64/FieldKit --smoke-test
          xvfb-run -a ./artifacts/publish/linux-x64/FieldKit --smoke-ui --data-dir work/published-smoke
      - name: Package portable desktop
        run: python scripts/package_desktop.py ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }} artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.rid }}
          path: |
            artifacts/FieldKit-*.zip
            artifacts/FieldKit-*.tar.gz
          if-no-files-found: error

  ios:
    name: iOS native build and core tests
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test portable Swift core
        run: swift test --package-path ios
      - name: Build iOS Simulator application
        run: xcodebuild -project ios/FieldKit.xcodeproj -scheme FieldKit -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath work/ios-derived CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned device archive
        run: xcodebuild -project ios/FieldKit.xcodeproj -scheme FieldKit -configuration Release -destination 'generic/platform=iOS' -archivePath artifacts/FieldKit-1.0.0-iOS-UNSIGNED.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Ad-hoc sign Simulator application
        run: codesign --force --deep --sign - work/ios-derived/Build/Products/Release-iphonesimulator/FieldKit.app
      - name: Package explicit unsigned artifacts
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent work/ios-derived/Build/Products/Release-iphonesimulator/FieldKit.app artifacts/FieldKit-1.0.0-iOS-Simulator.zip
          ditto -c -k --sequesterRsrc --keepParent artifacts/FieldKit-1.0.0-iOS-UNSIGNED.xcarchive artifacts/FieldKit-1.0.0-iOS-UNSIGNED.xcarchive.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-unsigned
          path: artifacts/*.zip
          if-no-files-found: error
      - name: Install and launch on disposable iPhone Simulator
        run: |
          python3 ios/smoke_simulator.py --app work/ios-derived/Build/Products/Release-iphonesimulator/FieldKit.app --output work/ios-smoke
      - name: Retain simulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-smoke-diagnostics
          path: work/ios-smoke/
          if-no-files-found: ignore
